function charts(){return`<section class="panel"><div class="graph-head"><div><h2>${chartMetric==='expenses'?'Из чего складываются расходы':chartMetric==='capital'?'Кто вложил в проект':'Динамика бизнеса'}</h2><p class="hint">${chartType==='donut'?'Структура за выбранный период · нажмите на категорию':'Последние шесть месяцев до выбранного · данные по дате признания'}</p></div><div class="graph-controls"><label><span class="sr-only">Показатель графика</span><select id="chartMetric" class="select"><option value="expenses" ${chartMetric==='expenses'?'selected':''}>Расходы</option><option value="result" ${chartMetric==='result'?'selected':''}>Продажи и результат</option><option value="capital" ${chartMetric==='capital'?'selected':''}>Вложения</option></select></label><div class="chart-tabs">${[['donut','Круговая'],['line','Линии'],['bar','Столбцы']].map(([id,label])=>`<button data-chart="${id}" class="${chartType===id?'active':''}" aria-pressed="${chartType===id}">${label}</button>`).join('')}</div></div></div>${chartType==='donut'?donut():trend()}<div class="chart-summary"><span>${chartMetric==='expenses'?'Товар входит в расходы после приёмки заказчиком.':chartMetric==='capital'?'Только взносы в капитал. Займы и возмещения учтены отдельно.':'Результат может быть отрицательным; он не равен остатку денег.'}</span><b>${chartType==='donut'?(period==='all'?'За всё время':monthName(period)):(monthName(months()[0])+' — '+monthName(currentMonth()))}</b></div></section>`;}
function overview(){const r=report();return head('Сколько остаётся от сделок','От продажи заказчику до денег, которые остаются после закупки и работы сервиса.')+`<div class="kpis">${kpi('Продажи заказчикам',r.revenue,'Принятые поставки за период','income')}${kpi('Закупка + исполнение',r.cogs+r.direct,'Товар, доставка и расходы сделок','cost')}${kpi('Сервисы и общие расходы',r.overhead,'Подписки, разработка, содержание','service-kpi')}${kpi('Осталось до налогов',r.result,'Результат бизнеса за период','result')}</div><div class="money-bridge">${[['Продажи',r.revenue],['Себестоимость товара',r.cogs],['Расходы сделок',r.direct],['Сервисы и работа',r.overhead],['Результат',r.result]].map(([t,v],i)=>`${i?`<span class="bridge-symbol">${i===4?'=':'−'}</span>`:''}<div class="bridge-step"><span>${t}</span><b class="num ${i===4?(v<0?'bad':'good'):''}">${money(v)}</b></div>`).join('')}</div>${charts()}<div class="twocol"><section class="panel"><div class="panelhead"><h2>Где сейчас деньги</h2><span class="tag">На ${shortDate(r.to)}</span></div><div class="statrow"><span>На счетах проекта</span><b>${money(r.cash)}</b></div><div class="statrow"><span>Заказчики ещё не оплатили</span><b class="copper">${money(r.receivable)}</b></div><div class="statrow"><span>Товар до приёмки заказчиком</span><b>${money(r.stock)}</b></div><p class="hint">Неоплаченная поставка уже может приносить прибыль, но деньги ещё не доступны на счёте.</p><button class="btn link" data-page="deals">Открыть сделки ${icon('arrow',14)}</button></section><section class="panel"><div class="panelhead"><h2>Контроль расходов</h2><button class="btn link" data-page="budgets">Бюджеты</button></div>${state.budgets.filter(b=>!b.deleted&&b.month===currentMonth()).slice(0,3).map(b=>{const fact=F.budgetActual(state,b);return`<div class="expenseitem"><div class="expense-top"><span>${esc(state.categories[b.category].name)}</span><b class="${fact>b.amount?'bad':'good'}">${money(fact)} / ${money(b.amount)}</b></div><div class="budgetbar"><span style="width:${b.amount?Math.min(100,fact/b.amount*100):100}%;background:${fact>b.amount?'#e34d60':'#2878ed'}"></span></div></div>`;}).join('')||'<p class="hint">На этот месяц бюджет не задан.</p>'}<button class="btn soft" data-new="budgets">Добавить бюджет</button></section></div>`;}
function selectedOps(){const [from,to]=bounds();let ids=null;if(drill?.type==='expenses')ids=new Set(F.ledger(state).filter(l=>l.date>=from&&l.date<=to&&['cogs','direct','overhead'].includes(l.debit)&&l.category===drill.id).map(l=>l.opId));return state.operations.filter(o=>Boolean(o.deleted)===showDeleted&&(ids?ids.has(o.id):o.date>=from&&o.date<=to)&&(!drill||drill.type!=='capital'||o.kind==='capital'&&o.partnerId===drill.id)&&(kindFilter==='all'||o.kind===kindFilter)&&[o.description,lookup('deals',o.dealId)?.name,pname(o.partnerId),lookup('services',o.serviceId)?.name].join(' ').toLowerCase().includes(search.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date)||b.order-a.order);}
function sliceAmount(o){if(drill?.type!=='expenses')return o.amount;const [from,to]=bounds();return F.ledger(state).filter(l=>l.opId===o.id&&l.date>=from&&l.date<=to&&l.category===drill.id&&['cogs','direct','overhead'].includes(l.debit)).reduce((s,l)=>s+l.amount,0);}
function opRows(){const items=selectedOps();return items.length?items.map(o=>`<tr class="${o.deleted?'deleted-row':''}"><td>${shortDate(o.date)}</td><td class="desc"><strong>${esc(o.description)}</strong><small>${esc(lookup('deals',o.dealId)?.name||lookup('services',o.serviceId)?.name||state.categories[o.category].name)}</small></td><td>${F.kinds[o.kind]}<small>${o.kind==='acceptance'?'Без движения денег':o.payer==='partner'?'Личная оплата: '+esc(pname(o.partnerId)):esc(lookup('accounts',o.accountId)?.name||'Без движения денег')}${o.kind==='acceptance'?' · выручка и себестоимость':''}</small></td><td class="right num">${money(sliceAmount(o))}</td><td class="row-actions">${actionButtons('operations',o)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Операций не найдено. Измените поиск или добавьте запись.</td></tr>';}
function operations(){return head('Операции по счетам','Фактические суммы вводятся вручную. Редактирование и удаление пересчитывают весь учёт.')+`<div class="operations-top"><label><span class="sr-only">Поиск операций</span><input id="search" class="search" placeholder="Найти операцию или сделку" value="${esc(search)}"></label><label><span class="sr-only">Тип операции</span><select id="kindFilter" class="select"><option value="all">Все операции</option>${Object.entries(F.kinds).map(([k,v])=>`<option value="${k}" ${kindFilter===k?'selected':''}>${v}</option>`).join('')}</select></label><button class="btn" data-export="csv">Выгрузить CSV</button>${archivedToggle()}</div>${drill?`<div class="info">Срез: ${esc(drill.type==='expenses'?state.categories[drill.id]?.name:pname(drill.id))}. ${drill.type==='expenses'?'Сумма показывает признанный расход в этом периоде.':''} <button class="btn link" id="clearDrill">Сбросить срез</button></div>`:''}<section class="panel" style="padding:0"><div class="tablewrap"><table class="table"><thead><tr><th>Дата</th><th>Операция</th><th>Вид / источник</th><th class="right">${drill?.type==='expenses'?'Расход в срезе':'Сумма операции'}</th><th class="right">Действия</th></tr></thead><tbody id="operationRows">${opRows()}</tbody></table></div></section><p class="hint">Удалённые записи можно восстановить. Если изменение нарушает связанную приёмку или возврат долга, демо покажет причину и сохранит прежние данные.</p>`;}
function deals(){const items=visibleItems('deals'),to=bounds()[1];const stage={plan:'План',won:'Выигран',delivered:'Поставка',lost:'Не выигран'};return head('Тендерные сделки','Закупка → приёмка → оплата. Прибыль возникает от поставок заказчикам.','deals','Добавить сделку')+`<div class="toolbar"><p class="hint">План не попадает в доход. Факт создаётся кнопками операций по сделке.</p>${archivedToggle()}</div><section class="panel" style="padding:0"><div class="tablewrap"><table class="table"><thead><tr><th>Сделка</th><th>Продажа / закупка</th><th>Результат сделки</th><th>Оплата заказчика</th><th>Действия</th></tr></thead><tbody>${items.map(d=>{const v=F.dealSummary(state,d.id,to);return`<tr><td class="desc"><strong>${esc(d.name)}</strong><small>${esc(d.customer)} · ${esc(pname(d.owner))}</small><small><span class="dealstage ${d.stage}">${stage[d.stage]}</span></small></td><td class="num">${money(v.accepted?v.revenue:d.planSale)}<small>${v.accepted?'Факт продажи':'План продажи'}</small><small>Куплено: ${money(v.purchase)}</small></td><td class="num ${v.accepted?(v.result<0?'bad':'good'):''}">${money(v.accepted?v.result:v.planResult)}<small>${v.accepted?'После прямых расходов':'Ожидаемый, не доход'}</small></td><td class="num">${money(v.received)}<small>${v.receivable?'К оплате: '+money(v.receivable):v.accepted?'Оплачено полностью':'До приёмки — аванс'}</small></td><td class="row-actions">${actionButtons('deals',d)}${!d.deleted?`<div class="service-tools"><button class="mini" data-deal-op="purchase" data-id="${d.id}">Закупка</button><button class="mini" data-deal-op="acceptance" data-id="${d.id}">Приёмка</button><button class="mini" data-deal-op="receipt" data-id="${d.id}">Оплата</button></div>`:''}</td></tr>`;}).join('')||'<tr><td colspan="5" class="empty">Добавьте первую сделку.</td></tr>'}</tbody></table></div></section><div class="info">Факт в таблице — накопленный по сделке на ${shortDate(to)}. Общие сервисы вычитаются один раз в сводке бизнеса. Товар следующей поставки остаётся вложением в товар до приёмки.</div>`;}
function services(){const items=visibleItems('services'),[from,to]=bounds();return head('Подписки и серверы','Добавляйте сервисы, меняйте план и записывайте каждый платёж с его фактической суммой.','services','Добавить подписку')+`<div class="toolbar"><p class="hint">Все цены в демо условные. Изменение плана не меняет прошлые платежи.</p>${archivedToggle('Показать удалённые подписки')}</div><div class="services">${items.map(s=>{const ops=state.operations.filter(o=>!o.deleted&&o.kind==='service'&&o.serviceId===s.id&&o.date>=from&&o.date<=to),paid=ops.reduce((n,o)=>n+o.amount,0);return`<article class="service"><div class="service-top"><div class="serviceicon" style="color:${state.categories[s.category].color}">${icon('services',22)}</div><div><h2>${esc(s.name)}</h2><p>${esc(state.categories[s.category].name)} · ${s.critical?'критичный сервис':'рабочий инструмент'}</p></div></div><div class="service-fact"><div>План ${s.cycle==='year'?'на год':s.cycle==='usage'?'потребления':'на месяц'}<strong class="num">${money(s.plan)}</strong></div><div>Оплачено за период<strong class="num ${paid?'good':''}">${money(paid)}</strong></div></div><div class="statrow"><span>Следующая дата по плану</span><b>${shortDate(s.next)}</b></div><div class="statrow"><span>Ответственный</span><b>${esc(pname(s.owner))}</b></div><div class="service-tools">${!s.deleted?`<button class="btn primary" data-service-pay="${s.id}">Записать оплату</button>`:''}${actionButtons('services',s)}</div></article>`;}).join('')||'<div class="empty">Подписок нет. Добавьте сервер, домен или рабочий инструмент.</div>'}</div><p class="hint space">Оплата здесь — запись о уже совершённом платеже. Демо не списывает деньги. При удалении подписки история её оплат сохраняется.</p>`;}
function partners(){const r=report();return head('Участники и вложения','Имена, роли, вложения и взаиморасчёты. Состав команды можно менять.','participants','Добавить участника')+`<div class="toolbar"><p class="hint">Остатки на ${shortDate(r.to)}. Вложения не определяют доли владения автоматически.</p>${archivedToggle('Показать участников в архиве')}</div><div class="services">${visibleItems('participants').map(p=>{const v=r.partners.find(x=>x.id===p.id);return`<article class="partnercard"><div class="partnerheader"><span class="avatar" style="background:${esc(p.color)};color:white">${esc(p.name.slice(0,1))}</span><div><h2>${esc(p.name)}</h2><p>${esc(p.role||'Участник')} ${p.deleted?'· архив':''}</p></div></div><div class="hint">Вложено в капитал</div><div class="partnerbig num">${money(v.capital)}</div><div class="statrow"><span>Остаток займа</span><b>${money(v.loan)}</b></div><div class="statrow"><span>Личные оплаты к возмещению</span><b>${money(v.payable)}</b></div><div class="statrow"><span>Выплачено участнику</span><b>${money(v.distributed)}</b></div><div class="partner-tools">${actionButtons('participants',p)}${!p.deleted?`<button class="mini" data-partner-op="capital" data-id="${p.id}">Внести деньги</button><button class="mini" data-partner-op="reimburse" data-id="${p.id}">Возместить</button><button class="mini" data-partner-op="withdraw" data-id="${p.id}">Выплата</button>`:''}</div></article>`;}).join('')||'<p class="empty">Нет участников в этом списке.</p>'}</div><div class="info">Удаление участника означает архивирование: его вклады, долги и история сохраняются. Переименование обновляется во всех связанных записях.</div>`;}
function scenarioResult(){const margin=Math.round(scenario.sale*100)-Math.round(scenario.purchase*100)-Math.round(scenario.direct*100),result=margin*scenario.count-Math.round(scenario.services*100);return`<div class="eyebrow" style="color:#b7d3ff">План сделок · не факт</div><div class="hint">Остаток после сервисов до налогов</div><div class="value num">${money(result)}</div><div class="cashrow"><span>Одна сделка после прямых расходов</span><b>${money(margin)}</b></div><div class="cashfoot">${margin>0?`Для покрытия ${money(Math.round(scenario.services*100))} сервисов нужно минимум <b>${Math.ceil(Math.round(scenario.services*100)/margin)} таких сделок</b>.`:'При этих ценах сделка не покрывает собственные расходы.'}<br>Это сценарий одинаковых сделок; сроки оплаты и оборотный капитал считаются отдельно.</div>`;}
function budgets(){const m=currentMonth();return head('Бюджеты и план','Контролируйте траты по статьям и участникам, планируйте прибыль от перепродажи.','budgets','Добавить бюджет')+`<div class="toolbar"><p class="hint">Бюджеты на ${monthName(m)}. Общий лимит и лимиты участников не складываются.</p>${archivedToggle()}</div><div class="budgetcards">${visibleItems('budgets').filter(b=>b.month===m).map(b=>{const fact=F.budgetActual(state,b),over=fact>b.amount;return`<article class="budgetcard"><div class="panelhead"><div><h2>${esc(state.categories[b.category].name)}</h2><p>${b.owner?'Ответственный: '+esc(pname(b.owner)):'Весь проект'}</p></div><span class="pill ${over?'warn':''}">${over?'Лимит превышен':'В пределах'}</span></div><div class="budgetnumbers"><span>Факт<br><strong class="${over?'bad':'good'}">${money(fact)}</strong></span><span>Бюджет<br><strong>${money(b.amount)}</strong></span></div><div class="budgetbar"><span style="width:${b.amount?Math.min(100,fact/b.amount*100):fact?100:0}%;background:${over?'#e34d60':'#2878ed'}"></span></div><p class="hint">${over?'Сверх бюджета: '+money(fact-b.amount):'Осталось: '+money(b.amount-fact)}</p><div class="service-tools">${actionButtons('budgets',b)}</div></article>`;}).join('')||'<p class="empty">На этот месяц бюджет не задан.</p>'}</div><section class="panel" style="margin-top:22px"><div class="panelhead"><div><h2>План прибыли от тендеров</h2><p>Все суммы можно изменить. Расчёт не создаёт реальные операции.</p></div></div><div class="twocol"><form id="scenarioForm"><div class="fields">${[['sale','Продажа одной сделки, ₽'],['purchase','Закупка товара, ₽'],['direct','Расходы одной сделки, ₽'],['count','Количество сделок'],['services','Сервисы и общие расходы, ₽']].map(([k,label])=>`<div class="field ${k==='services'?'full':''}"><label for="scenario-${k}">${label}</label><input id="scenario-${k}" name="${k}" type="number" min="0" max="${k==='count'?1000:100000000}" step="${k==='count'?'1':'0.01'}" value="${scenario[k]}" document.addEventListener('input',e=>{
 if(e.target.id==='search'){search=e.target.value;$('#operationRows').innerHTML=opRows();}
 if(e.target.closest('#scenarioForm')){const form=$('#scenarioForm');if(!form.checkValidity()){$('#scenarioResult').textContent='Проверьте суммы и целое количество сделок.';return;}scenario=Object.fromEntries([...new FormData(form)].map(([k,v])=>[k,Number(v)]));$('#scenarioResult').innerHTML=scenarioResult();}
});
$('#editorForm').addEventListener('submit',submitEditor);
$('#backupFile').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2*1024*1024)throw Error('Для демо размер JSON ограничен 2 МБ');const next=JSON.parse(await f.text());F.ledger(next);askConfirm('Восстановить JSON-копию?',`Текущие данные будут заменены. Проект: ${next.settings.name}, операций: ${next.operations.length}.`,'Восстановить',()=>{period=next.asOf.slice(0,7);drill=null;save(next,'Копия восстановлена');});}catch(error){toast('Не удалось прочитать копию: '+error.message);}e.target.value='';});
window.addEventListener('hashchange',()=>{const id=location.hash.split('/')[1];if(names[id]&&id!==page){page=id;showDeleted=false;render();}});
const initial=location.hash.split('/')[1];if(names[initial])page=initial;period=state.asOf.slice(0,7);$('#main').setAttribute('tabindex','-1');render();if(storageWarning)toast(storageWarning);
})();
